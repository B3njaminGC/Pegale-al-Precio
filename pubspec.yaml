name: pegale_al_precio
description: Adiviná el precio en pesos de productos reales de Mercado Libre Argentina.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - data/products.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-only.png
  adaptive_icon_background: assets/icon-background.png
  adaptive_icon_foreground: assets/icon-foreground.png
