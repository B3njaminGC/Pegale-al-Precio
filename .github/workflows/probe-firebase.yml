name: Probar Firebase

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar sesión, ranking, salas y reglas
        run: node scripts/probe-firebase.mjs
