name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar en Releases (por ejemplo v2.0.0). Si queda vacío, solo compila."
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "ci/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear el proyecto Android
        run: |
          flutter --version 2>&1 | tee -a ci.log
          flutter create --platforms=android --org com.pegalealprecio --project-name pegale_al_precio . 2>&1 | tee -a ci.log
          rm -f test/widget_test.dart

      - name: Configurar la app (nombre, internet, firma)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Pegale al Precio"', s, count=1)
          extra = ('\n    <uses-permission android:name="android.permission.INTERNET"/>'
                   '\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW"/>\n'
                   '            <data android:scheme="https"/>\n        </intent>\n    </queries>')
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + extra, s, count=1)
          s = s.replace('<activity\n', '<activity\n            android:screenOrientation="portrait"\n', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          grep -n "label\|INTERNET\|screenOrientation" android/app/src/main/AndroidManifest.xml | tee -a ci.log

      - name: Bajar dependencias
        run: flutter pub get 2>&1 | tee -a ci.log

      - name: Generar los íconos
        run: dart run flutter_launcher_icons 2>&1 | tee -a ci.log

      - name: Revisar el código
        continue-on-error: true
        run: flutter analyze 2>&1 | tee -a ci.log

      - name: Probar la lógica del juego
        continue-on-error: true
        run: flutter test 2>&1 | tee -a ci.log

      - name: Compilar el APK
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a ci.log

      - name: Dar nombre al archivo y mostrar la firma
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pegale-al-precio.apk
          echo "FIRMA DEL APK:" | tee -a ci.log
          keytool -printcert -jarfile pegale-al-precio.apk 2>&1 | grep -E "Owner|SHA256" | tee -a ci.log

      - name: Guardar el APK en la corrida
        uses: actions/upload-artifact@v4
        with:
          name: pegale-al-precio-apk
          path: pegale-al-precio.apk

      - name: Publicar el APK en Releases (por tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pegale-al-precio.apk

      - name: Publicar el APK en Releases (a pedido)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pegale al Precio ${{ inputs.version }}
          body: App hecha en Flutter, solo para celular. Fotos, salas online y ranking de Argentina.
          make_latest: true
          files: pegale-al-precio.apk

      - name: Guardar el registro de la compilación
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp ci.log /tmp/cilog/ci.log 2>/dev/null || echo "sin registro" > /tmp/cilog/ci.log
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-log
          git add ci.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "registro de la compilación ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
