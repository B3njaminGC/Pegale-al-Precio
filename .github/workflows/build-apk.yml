name: Compilar APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Generar los íconos de la app
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Dejar la app en vertical
        run: sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Copiar el juego al proyecto
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Dar nombre al archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pegale-al-precio.apk

      - name: Guardar el APK en la corrida
        uses: actions/upload-artifact@v4
        with:
          name: pegale-al-precio-apk
          path: pegale-al-precio.apk

      - name: Publicar el APK en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pegale-al-precio.apk
